name: Coverage and SonarQube

on:
  push:
    branches: [main, "tickets/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install locked shell analyzers
        run: |
          set -Eeuo pipefail
          source .github/tool-versions.env
          sudo apt-get -o Acquire::ForceIPv4=true update
          sudo apt-get -o Acquire::ForceIPv4=true install -y --no-install-recommends \
            "shellcheck=${SHELLCHECK_PACKAGE_VERSION}" \
            "shfmt=${SHFMT_PACKAGE_VERSION}"
          test "$(shellcheck --version | awk '/^version:/{print $2}')" = "${SHELLCHECK_VERSION}"
          test "$(shfmt --version)" = "${SHFMT_VERSION}"
      - name: Run immutable static analysis
        run: |
          set -Eeuo pipefail
          git ls-files -z '*.sh' ltree | xargs -0 shellcheck --severity=error
          shfmt -d -i 2 -ci .github/scripts/run-coverage.sh
      - name: Run safe shell tests with coverage
        run: bash .github/scripts/run-coverage.sh
      - name: Verify SonarQube report
        run: test -s coverage/sonar-generic-coverage.xml
      - name: Require SonarQube Cloud token
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Missing SONAR_TOKEN repository secret; coverage cannot be published."
            exit 1
          fi
      - name: Run SonarQube Cloud analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.run_attempt }}
          path: |
            coverage/bash.trace
            coverage/sonar-generic-coverage.xml
          if-no-files-found: error
